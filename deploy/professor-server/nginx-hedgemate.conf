server {
    listen 80;
    server_name hedgemate.eyefeet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hedgemate.eyefeet.com;

    # Adjust certificate paths for the professor server.
    ssl_certificate /etc/letsencrypt/live/hedgemate.eyefeet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hedgemate.eyefeet.com/privkey.pem;

    root /opt/hedgemate/current/hedgemate-beecast-fix/hedge-front/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
